# Voxel Craft is a static site with no build step: the files are served as-is.
# The one piece of server code is netlify/functions/signal.mts, the join mailbox
# for multiplayer over the internet (src/net/transport.js); Netlify bundles it
# from netlify/functions, and installs @netlify/blobs for it from package.json.
[build]
  publish = "."
  command = ""

# ES modules and the Web Worker must be served with correct MIME types.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
